<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alterar Balão - Festa App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<!-- Menu de Navegação Superior -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="../index.html">🎉 Festa App</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="../index.html">Página Inicial</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="read.html">Gerenciar Balões</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Conteúdo Principal -->
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-warning text-dark">
                    <h4 class="mb-0">Editar Balão #1</h4>
                </div>
                <div class="card-body">

                    <form action="read.html" method="GET">

                        <!-- 1. Atributo String: Modelo / Cor -->
                        <div class="mb-3">
                            <label for="modelo" class="form-label">Modelo / Cor do Balão (String):</label>
                            <input type="text" class="form-control" id="modelo" value="Metalizado Estrela Dourada" required>
                        </div>

                        <!-- 2. Atributo Inteiro: Tamanho em Polegadas -->
                        <div class="mb-3">
                            <label for="tamanho" class="form-label">Tamanho em Polegadas (Inteiro):</label>
                            <input type="number" class="form-control" id="tamanho" value="12" min="1" required>
                        </div>

                        <!-- 3. Atributo Float: Preço Unitário -->
                        <div class="mb-3">
                            <label for="preco" class="form-label">Preço Unitário R$ (Float):</label>
                            <input type="number" step="0.01" class="form-control" id="preco" value="15.90" required>
                        </div>

                        <!-- 4. Atributo Boolean: Flutua com Hélio -->
                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="flutuaHelio" checked>
                            <label class="form-check-label" for="flutuaHelio">Suporta Gás Hélio? (Boolean)</label>
                        </div>

                        <!-- Botoes de Ação -->
                        <div class="d-flex justify-content-between mt-4">
                            <a href="read.html" class="btn btn-secondary">Cancelar / Voltar</a>
                            <button type="submit" class="btn btn-warning">Atualizar Balão</button>
                        </div>

                    </form>

                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
