<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>Procurar Docinho</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
            rel="stylesheet"
    >

</head>

<body>

<!-- menu -->

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    <div class="container-fluid">

        <a
                class="navbar-brand"
                href="../index.html"
        >
            🎉 Festa App
        </a>

        <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav"
                aria-controls="navbarNav"
                aria-expanded="false"
                aria-label="Abrir menu"
        >
            <span class="navbar-toggler-icon"></span>
        </button>

        <div
                class="collapse navbar-collapse"
                id="navbarNav"
        >

            <ul class="navbar-nav">

                <li class="nav-item">
                    <a
                            class="nav-link"
                            href="../index.html"
                    >
                        Início
                    </a>
                </li>

                <li class="nav-item">
                    <a
                            class="nav-link"
                            href="create.html"
                    >
                        Inserir
                    </a>
                </li>

                <li class="nav-item">
                    <a
                            class="nav-link"
                            href="update.html"
                    >
                        Alterar
                    </a>
                </li>

                <li class="nav-item">
                    <a
                            class="nav-link"
                            href="delete.html"
                    >
                        Excluir
                    </a>
                </li>

            </ul>

        </div>

    </div>

</nav>

<!-- Conteúdo -->

<main class="container mt-5">

    <h1 class="mb-4">
        Procurar Docinho
    </h1>


    <!-- Campo de pesquisa -->

    <form class="mb-4">

        <div class="input-group">

            <input
                    type="text"
                    class="form-control"
                    placeholder="Digite o nome do docinho"
            >

            <button
                    type="submit"
                    class="btn btn-primary"
            >
                Procurar
            </button>

        </div>

    </form>

    <!-- Tabela de Resultados -->

    <div class="table-responsive">

        <table class="table table-striped table-bordered">

            <thead class="table-dark">

            <tr>

                <th>Nome</th>

                <th>Quantidade</th>

                <th>Preço</th>

                <th>Possui recheio?</th>

            </tr>

            </thead>

            <tbody>

            <!-- Exemplo de registro -->

            <tr>

                <td>Brigadeiro</td>

                <td>50</td>

                <td>2.50</td>

                <td>Sim</td>

            </tr>


            <tr>

                <td>Beijinho</td>

                <td>30</td>

                <td>2.00</td>

                <td>Não</td>

            </tr>


            <tr>

                <td>Cajuzinho</td>

                <td>40</td>

                <td>2.75</td>

                <td>Sim</td>

            </tr>

            </tbody>

        </table>

    </div>


    <!-- Botão voltar -->

    <a
            href="../index.html"
            class="btn btn-secondary"
    >
        Voltar
    </a>

</main>


<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
