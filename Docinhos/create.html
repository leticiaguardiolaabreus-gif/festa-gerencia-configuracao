<!DOCTYPE html>
<html lang="pt-br">

<head>
    <!-- Define a codificação dos caracteres -->
    <meta charset="UTF-8">

    <!-- Faz a página se adaptar a diferentes tamanhos de tela -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Título que aparece na aba do navegador -->
    <title>Inserir Docinho</title>

    <!-- Bootstrap CSS -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
            rel="stylesheet"
    >
</head>

<body>

<!-- menu -->

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    <div class="container-fluid">

        <!-- Nome do sistema -->
        <a class="navbar-brand" href="../index.html">
            🎉 Festa App
        </a>

        <!-- Botão para telas menores -->
        <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav"
                aria-controls="navbarNav"
                aria-expanded="false"
                aria-label="Abrir menu"
        >
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Links do menu -->
        <div class="collapse navbar-collapse" id="navbarNav">

            <ul class="navbar-nav">

                <!-- Link para voltar ao início -->
                <li class="nav-item">
                    <a class="nav-link" href="../index.html">
                        Início
                    </a>
                </li>

                <!-- Link para procurar -->
                <li class="nav-item">
                    <a class="nav-link" href="read.html">
                        Procurar
                    </a>
                </li>

                <!-- Link para alterar -->
                <li class="nav-item">
                    <a class="nav-link" href="update.html">
                        Alterar
                    </a>
                </li>

                <!-- Link para excluir -->
                <li class="nav-item">
                    <a class="nav-link" href="delete.html">
                        Excluir
                    </a>
                </li>

            </ul>

        </div>

    </div>

</nav>

<!-- formulário de inserção -->
<main class="container mt-5">

    <!-- Título da página -->
    <h1 class="mb-4">
        Inserir Docinho
    </h1>

    <!-- Formulário -->
    <form>

        <!-- Campo nome -->
        <div class="mb-3">

            <label for="nome" class="form-label">
                Nome do docinho
            </label>

            <!-- String -->
            <input
                    type="text"
                    class="form-control"
                    id="nome"
                    placeholder="Ex.: Brigadeiro"
            >

        </div>


        <!-- Campo quantidade -->
        <div class="mb-3">

            <label for="quantidade" class="form-label">
                Quantidade
            </label>

            <!-- Inteiro -->
            <input
                    type="number"
                    class="form-control"
                    id="quantidade"
                    placeholder="Ex.: 50"
            >

        </div>


        <!-- Campo preço -->
        <div class="mb-3">

            <label for="preco" class="form-label">
                Preço
            </label>

            <!-- Float -->
            <input
                    type="number"
                    class="form-control"
                    id="preco"
                    step="0.01"
                    placeholder="Ex.: 2.50"
            >

        </div>


        <!-- Campo booleano -->
        <div class="form-check mb-3">

            <input
                    class="form-check-input"
                    type="checkbox"
                    id="temRecheio"
            >

            <label
                    class="form-check-label"
                    for="temRecheio"
            >
                Possui recheio?
            </label>

        </div>


        <!-- Botão -->
        <button
                type="submit"
                class="btn btn-primary"
        >
            Inserir Docinho
        </button>

        <!-- Botão para voltar -->
        <a
                href="../index.html"
                class="btn btn-secondary"
        >
            Voltar
        </a>

    </form>

</main>


<!-- Bootstrap JavaScript -->
<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
