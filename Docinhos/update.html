                aria-controls="navbarNav"

                aria-label="Abrir menu"
        >
            <span class="navbar-toggler-icon"></span>
        </button>

        <div
                class="collapse navbar-collapse"

            <ul class="navbar-nav">

                <li class="nav-item">

<!-- Formulário de Alteração -->

<main class="container mt-5">

    <h1 class="mb-4">
        Alterar Docinho
    </h1>


    <form>

        <!-- Nome -->

        <div class="mb-3">

            <label
                    for="nome"
                    class="form-label"
            >
                Nome do docinho
            </label>

            <input
                    type="text"
                    class="form-control"
                    id="nome"
                    value="Brigadeiro"
            >

        </div>


        <!-- Quantidade -->

        <div class="mb-3">

            <label
                    for="quantidade"
                    class="form-label"
            >
                Quantidade
            </label>

            <input
                    type="number"
                    class="form-control"
                    id="quantidade"
                    value="50"
            >

        </div>


        <!-- Preço -->

        <div class="mb-3">

            <label
                    for="preco"
                    class="form-label"
            >
                Preço
            </label>

            <input
                    type="number"
                    class="form-control"
                    id="preco"
                    step="0.01"
                    value="2.50"
            >

        </div>


        <!-- Recheio -->

        <div class="form-check mb-3">

            <input
                    class="form-check-input"
                    type="checkbox"
                    id="temRecheio"
                    checked
            >

            <label
                    class="form-check-label"
                    for="temRecheio"
            >
                Possui recheio?
            </label>

        </div>


        <!-- Botão salvar -->

        <button
                type="submit"
                class="btn btn-warning"
        >
            Alterar Docinho
        </button>


        <!-- Botão voltar -->

        <a
                href="../index.html"
                class="btn btn-secondary"
        >
            Voltar
        </a>

    </form>

</main>

        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
