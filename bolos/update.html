<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Alterar Bolo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container mt-5" style="max-width: 600px;">
    <div class="card shadow-sm">
      <div class="card-header bg-warning text-dark">
        <h4 class="mb-0">Editar Registro do Bolo</h4>
      </div>
      <div class="card-body">
        <form>
          <div class="mb-3">
            <label class="form-label">ID</label>
            <input type="text" class="form-control" value="1" readonly>
          </div>
          <div class="mb-3">
            <label class="form-label">Sabor</label>
            <input type="text" class="form-control" value="Cenoura com Chocolate">
          </div>
          <div class="mb-3">
            <label class="form-label">Fatias</label>
            <input type="number" class="form-control" value="15">
          </div>
          <div class="mb-3">
            <label class="form-label">Peso (Kg)</label>
            <input type="number" step="0.1" class="form-control" value="1.8">
          </div>
          <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="diet">
            <label class="form-check-label" for="diet">Bolo Diet?</label>
          </div>
          <button type="submit" class="btn btn-warning">Atualizar</button>
          <a href="../index.html" class="btn btn-secondary">Cancelar</a>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
