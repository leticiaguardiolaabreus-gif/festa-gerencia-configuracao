<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Procurar Bolo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2>Catálogo de Bolos</h2>
      <a href="../index.html" class="btn btn-secondary">Voltar ao Inicio</a>
    </div>

    <table class="table table-striped table-hover shadow-sm">

        <tr>
          <th>ID</th>
          <th>Sabor</th>
          <th>Fatias</th>
          <th>Peso (Kg)</th>
          <th>Diet?</th>

      </thead>
      <tbody>
        <tr>
          <td>1</td>
          <td>Cenoura com Chocolate</td>
          <td>15</td>
          <td>1.8</td>
          <td><span class="badge bg-secondary">Não</span></td>
        </tr>
        <tr>
          <td>2</td>
          <td>Red Velvet</td>
          <td>25</td>
          <td>3.0</td>
          <td><span class="badge bg-success">Sim</span></td>
        </tr>
      </tbody>
    </table>
  </div>
