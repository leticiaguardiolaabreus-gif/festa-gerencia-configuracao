<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Inserir Bolo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container mt-5" style="max-width: 600px;">
    <div class="card shadow-sm">
      <div class="card-header bg-primary text-white">
        <h4 class="mb-0">Cadastrar Novo Bolo</h4>
      </div>
      <div class="card-body">
        <form>
          <div class="mb-3">
            <label class="form-label">Sabor do Bolo</label>
            <input type="text" class="form-control" placeholder="Ex: Chocolate com Morango" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Número de Fatias</label>
            <input type="number" class="form-control" placeholder="Ex: 20" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Peso Total (Kg)</label>
            <input type="number" step="0.1" class="form-control" placeholder="Ex: 2.5" required>
          </div>
          <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="diet">
            <label class="form-check-label" for="diet">Bolo Diet (Sem Açúcar)?</label>
          </div>
          <button type="submit" class="btn btn-success">Salvar</button>
          <a href="../index.html" class="btn btn-secondary">Voltar</a>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
